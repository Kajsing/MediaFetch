[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mediafetch-host"
version = "0.2.1"
description = "Local Native Messaging download host for MediaFetch"
requires-python = ">=3.12"
dependencies = ["yt-dlp==2026.8.19", "yt-dlp-ejs==0.8.0", "deno==2.9.5"]

[tool.setuptools.packages.find]
where = ["src"]
