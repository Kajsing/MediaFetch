@media(max-width:800px){#mf-product-preview .mf-sidebar{width:130px}#mf-product-preview .mf-main{padding:22px 20px}#mf-product-preview .mf-popups{grid-template-columns:minmax(290px,408px) minmax(220px,1fr);gap:18px}}
@media(max-width:640px){#mf-product-preview .mf-sidebar{display:none!important}#mf-product-preview .mf-app-top{padding:16px!important}#mf-product-preview .mf-main{padding:20px 16px!important}#mf-product-preview .mf-title-row{flex-wrap:wrap;gap:12px}#mf-product-preview .mf-popups{grid-template-columns:1fr;gap:20px}#mf-product-preview .mf-popup{margin:0 auto}#mf-product-preview .mf-inline-specimen{max-width:408px;width:100%;margin:0 auto}#mf-product-preview .mf-entry{flex-wrap:wrap}#mf-product-preview .mf-entry>label{flex-basis:100%;padding:7px}#mf-product-preview .mf-entry select{flex:1;max-width:none}#mf-product-preview .mf-entry .mf-primary{flex:1}#mf-product-preview .mf-job-line{flex-wrap:wrap;gap:5px}#mf-product-preview .mf-job-status{font-size:11px}#mf-product-preview[data-design=archive] .mf-app-top{margin:0 16px}#mf-product-preview .mf-connected{font-size:11px}#mf-design-board .mf-view-label{width:100%;justify-content:space-between}#mf-design-board .mf-demo-footer{align-items:flex-start}#mf-product-preview[data-design=signal] .mf-entry>label{margin-bottom:8px}#mf-product-preview[data-design=signal] .mf-entry select{border:1px solid var(--mf-line)}}
@media(pointer:coarse){#mf-design-board button{min-height:44px}#mf-product-preview input,#mf-product-preview select{font-size:16px!important}#mf-product-preview .mf-inline-button{height:44px}}
</style>
<script>
(() => {
  const root = document.getElementById('mf-design-board');
  const preview = document.getElementById('mf-product-preview');
  const descriptions = { slate: 'Quiet precision · cool graphite · compact workspace', canvas: 'Everyday clarity · soft white · generous spacing', signal: 'Transfer console · ink and acid · strong information hierarchy', archive: 'Personal collection · warm paper · editorial typography' };
  const initial = [
    { id:1, title:'Enterprise-D bridge recreated in Blender', source:'Reddit', state:'downloading', detail:'Up to 1080p · 5.5 of 11.5 MB', percent:48 },
    { id:2, title:'Computer, lights on please', source:'X', state:'merging', detail:'Up to 1080p · 21.5 MB' },
    { id:3, title:'A small world, built from scratch', source:'X', state:'failed', detail:'Up to 720p', error:'This video needs access that the helper does not have.' },
    { id:4, title:'A research facility built by Astra', source:'Reddit', state:'completed', detail:'1080p · 23.0 MB · Today' },
    { id:5, title:'Rain after midnight in Seoul', source:'X', state:'completed', detail:'720p · 8.2 MB · Yesterday' }
  ];
  const state = { direction:'slate', surface:'downloads', density:0, settings:false };
  const saved = window.openai?.widgetState?.modelContent;
  if (saved && descriptions[saved.direction]) state.direction = saved.direction;
  if (saved && ['downloads','popup'].includes(saved.surface)) state.surface = saved.surface;
  const restoreDensity = value => {if (Number.isFinite(value)) state.density = Math.max(-5,Math.min(8,value));};
  restoreDensity(window.openai?.widgetState?.privateContent?.density);
  let jobs = initial.map(j => ({...j}));
  const icon = name => `<i data-lucide="${name}" class="mf-icon" aria-hidden="true"></i>`;
  const action = (label, value, id) => `<button type="button" class="cursor-interaction" data-job-action="${value}" data-job-id="${id}">${label}</button>`;
  const primary = (text, intent) => `<button type="button" class="mf-primary cursor-interaction" data-intent="${intent}">${icon('arrow-down-to-line')}${text}</button>`;
  const brand = () => `<div class="mf-brand"><span class="mf-brand-symbol">${icon('arrow-down-to-line')}</span>MediaFetch</div>`;
  const connection = () => '<span class="mf-connected">Local helper connected</span>';
  const count = () => jobs.filter(j => ['downloading','merging','queued'].includes(j.state)).length;
  function entry() {
    return `<div class="mf-entry"><label>${icon('link')}<input aria-label="Post link" placeholder="Paste a Reddit or X post link" autocomplete="off"></label><select aria-label="Video quality"><option>Up to 1080p</option><option>Up to 720p</option><option>Best available</option></select>${primary('Download','download')}</div>`;
  }
  function row(job, index) {
    const active = ['downloading','merging','queued'].includes(job.state);
    const complete = job.state === 'completed';
    const status = job.state === 'downloading' ? `${job.percent}%` : job.state.charAt(0).toUpperCase()+job.state.slice(1);
    let buttons = complete ? action('Remove from list','forget',job.id) : active ? action('Stop','stop',job.id)+action('Stop and delete','delete',job.id) : job.state === 'stopped' ? action('Continue','resume',job.id)+action('Retry','retry',job.id)+action('Delete partial files','delete',job.id) : action('Retry','retry',job.id)+action('Remove from list','forget',job.id);
    const mark = state.direction === 'archive' || state.direction === 'signal' ? String(index+1).padStart(2,'0') : icon(complete ? 'file-video' : active ? 'arrow-down' : 'circle-alert');
    return `<article class="mf-job" data-state="${job.state}"><span class="mf-file-mark ${active?'is-active':''}">${mark}</span><div class="mf-job-body"><div class="mf-job-line"><h3 class="mf-job-name">${job.title}</h3><span class="mf-job-status ${active?'status-active':complete?'status-complete':job.state==='failed'?'status-failed':''}">${complete?icon('check'):''}${status}</span></div><div class="mf-meta"><span class="mf-source">${job.source}</span><span>·</span><span>${job.detail}</span></div>${job.state==='downloading'?`<div class="mf-progress" role="progressbar" aria-label="Download progress" aria-valuenow="${job.percent}" aria-valuemin="0" aria-valuemax="100"><span style="width:${job.percent}%"></span></div>`:''}${job.state==='failed'?`<p class="mf-error">${job.error}</p>`:''}<div class="mf-actions">${buttons}</div></div></article>`;
  }
  function groups(compact=false) {
    if (!jobs.length) return '<div class="mf-empty">Your list is clear. Saved videos stay on your computer.</div>';
    const categories = compact ? [ { name:'Recent downloads', match:() => true } ] : [
      {name:'In progress',match:j=>['downloading','merging','queued'].includes(j.state)},
      {name:'Needs attention',match:j=>['failed','stopped','cancelled'].includes(j.state)},
      {name:state.direction==='archive'?'Saved to your collection':'Finished',match:j=>j.state==='completed'}
    ];
    return categories.map(group => {
      const subset = jobs.filter(group.match).slice(0,compact?2:99);
      return subset.length ? `<div class="mf-group-head"><span>${group.name}</span><span>${subset.length}</span></div>${subset.map(j=>row(j,jobs.indexOf(j))).join('')}` : '';
    }).join('');
  }
  function settings() {
    return state.settings ? `<section class="mf-settings"><div class="mf-settings-head">Preferences<button type="button" class="cursor-interaction" data-intent="settings">Close</button></div><label>Default quality<select aria-label="Default quality"><option>Up to 1080p</option><option>Up to 720p</option><option>Best available</option></select></label><label>Show buttons on Reddit<input type="checkbox" checked></label><label>Show buttons on X<input type="checkbox" checked></label><p class="mf-subtitle">Download folder: Downloads / VideoDownload</p></section>` : '';
  }
  function footer() { return `<div class="mf-destination"><span>${icon('folder')}Downloads / VideoDownload</span><span>Saved files stay on your computer</span></div>`; }
  function desktop() {
    const title = state.direction==='signal'?'Transfers':state.direction==='archive'?'Your collection':'Downloads';
    const clearDisabled = !jobs.some(j=>['failed','completed','cancelled'].includes(j.state));
    return `<section class="mf-app"><div class="mf-app-top">${brand()}${connection()}</div><div class="mf-layout"><aside class="mf-sidebar"><div class="mf-sidebar-label">WORKSPACE</div><button type="button" class="mf-nav-current cursor-interaction" data-intent="downloads" aria-label="Downloads">${icon('download')}<span>Downloads</span></button><button type="button" class="cursor-interaction" data-intent="settings" aria-label="Settings">${icon('settings-2')}<span>Settings</span></button><small>MediaFetch 0.1.1<br>On your computer.</small></aside><main class="mf-main"><div class="mf-title-row"><div><h2>${title}</h2><p class="mf-subtitle">${count()} active · ${jobs.filter(j=>j.state==='failed').length} needs attention</p></div><div class="mf-toolbar">${['canvas','archive'].includes(state.direction)?`<button type="button" class="cursor-interaction" data-intent="settings">${icon('settings-2')}Settings</button>`:''}<button type="button" class="cursor-interaction" data-intent="clear" ${clearDisabled?'disabled':''}>${icon('list-x')}Remove all</button></div></div>${settings()}${entry()}${groups()}${footer()}</main></div></section>`;
  }
  function popup() {
    return `<div class="mf-popups"><section class="mf-popup" aria-label="Toolbar popup"><div class="mf-app-top">${brand()}<button type="button" class="cursor-interaction" data-intent="settings" aria-label="Settings">${icon('settings-2')}</button></div><div class="mf-main"><div class="mf-title-row"><h2>${state.direction==='archive'?'Keep this one.':state.direction==='signal'?'Fetch a video':'Save a video'}</h2></div>${settings()}${entry()}${groups(true)}</div><div class="mf-popup-foot"><span>${jobs.filter(j=>j.state==='failed').length} needs attention</span><button type="button" class="cursor-interaction" data-intent="downloads">View all downloads →</button></div></section><section class="mf-inline-specimen" aria-label="In-page button concept"><div class="mf-spec-label">In-page control</div><div class="mf-post-header"><div class="mf-avatar">M1</div><div>Video post<small>@example · 2h</small></div></div><p class="mf-post-caption">Computer, lights on please.</p><div class="mf-video-surface" aria-label="Video placeholder">${icon('play')}</div><div class="mf-social-actions">${icon('message-circle')}${icon('repeat-2')}${icon('heart')}${icon('bookmark')}${icon('share')}</div><button type="button" class="mf-inline-button cursor-interaction" data-intent="inline">${icon('arrow-down-to-line')}Save video</button><p class="mf-inline-note">A compact control below the post actions.</p></section></div>`;
  }
  function persist() {
    window.openai?.setWidgetState?.({modelContent:{direction:state.direction,surface:state.surface},privateContent:{density:state.density}})?.catch(()=>{});
  }
  function render() {
    preview.dataset.design=state.direction;
    preview.style.setProperty('--mf-density',state.density+'px');
    preview.innerHTML=state.surface==='popup'?popup():desktop();
    root.querySelectorAll('[data-direction]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.direction===state.direction)));
    root.querySelector('[aria-label="Preview surface"]').value=state.surface;
    root.querySelector('#mf-direction-description').textContent=descriptions[state.direction];
    if(globalThis.lucide) lucide.createIcons({attrs:{width:16,height:16}});
  }
  const feedback = text => {root.querySelector('#mf-demo-status').textContent=text;};
  root.addEventListener('click',event=>{
    const button=event.target.closest('button'); if(!button||!root.contains(button))return;
    if(button.dataset.direction){state.direction=button.dataset.direction;state.settings=false;render();persist();return;}
    if(button.classList.contains('mf-reset')){jobs=initial.map(j=>({...j}));state.settings=false;render();feedback('Sample jobs reset · no real files are affected');return;}
    const intent=button.dataset.intent;
    if(intent==='clear'){jobs=jobs.filter(j=>!['completed','failed','cancelled'].includes(j.state));render();feedback('Finished entries removed. Active downloads and saved videos are kept.');return;}
    if(intent==='settings'){state.settings=!state.settings;render();return;}
    if(intent==='downloads'){state.surface='downloads';state.settings=false;render();persist();return;}
    if(intent==='inline'){button.innerHTML=icon('check')+' Added to downloads';if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});feedback('Inline button feedback · preview only');return;}
    if(intent==='download'){
      const input=button.closest('.mf-entry').querySelector('input');
      if(!input.value.trim()){input.focus();feedback('Paste a post link to try the mock interaction.');return;}
      const nextId=Math.max(0,...jobs.map(j=>j.id))+1;
      jobs.unshift({id:nextId,title:'New video from your link',source:'X',state:'queued',detail:'Up to 1080p · Waiting for an available slot'});
      render();feedback('Sample video queued · no network request was made');return;
    }
    const job=jobs.find(j=>j.id===Number(button.dataset.jobId));if(!job)return;
    const operation=button.dataset.jobAction;
    if(operation==='forget'){jobs=jobs.filter(j=>j!==job);feedback('Entry removed. The saved video is kept.');}
    if(operation==='stop'){job.state='stopped';feedback('Stopped. Partial files are kept for Continue.');}
    if(operation==='delete'){job.state='cancelled';job.detail='Partial files removed';feedback('Cancelled. Only this sample job’s partial files were removed.');}
    if(operation==='resume'||operation==='retry'){job.state='queued';job.detail='Waiting for an available slot';feedback(operation==='resume'?'Continue queued with retained data.':'Fresh attempt queued.');}
    render();
  });
  root.querySelector('[aria-label="Preview surface"]').addEventListener('change',event=>{state.surface=event.target.value;state.settings=false;render();persist();});
  window.addEventListener('openai:set_globals',event=>{
    const snapshot=event.detail?.globals?.widgetState;
    if(!snapshot)return;
    if(descriptions[snapshot.modelContent?.direction])state.direction=snapshot.modelContent.direction;
    if(['downloads','popup'].includes(snapshot.modelContent?.surface))state.surface=snapshot.modelContent.surface;
    restoreDensity(snapshot.privateContent?.density);
    render();
  });
  render();
  if(globalThis.Tweak){const tweak=new Tweak({container:preview,onChange:()=>{render();persist();}});tweak.addSlider(state,'density',{label:'Row breathing room',min:-5,max:8,step:1,unit:'px',reference:'--mf-density'});}
})();
</script>
